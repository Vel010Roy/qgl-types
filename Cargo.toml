[package]
name = "qgl-types"
version = "0.1.0"
edition = "2021"
description = "Shared payload types for the QGL ecosystem (nexox/minox/argox)"
license = "MIT"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
